function ic(n,s){return '<svg width="'+(s||22)+'" height="'+(s||22)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+IC[n]+'</svg>';}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function $(id){return document.getElementById(id);}
function short(n){return String(n||'').split(' ')[0];}
function ini(n){var p=String(n||'?').split(' ');return (p[0]?p[0][0]:'')+(p[1]?p[1][0]:'');}
function avc(n){var h=0;String(n).split('').forEach(function(c){h=(h*31+c.charCodeAt(0))%997;});return AVC[h%AVC.length];}
function av(n,s){if(!n)return '<span class="av" style="background:var(--gray-bg);color:var(--fnt)">?</span>';var c=avc(n);return '<span class="av" style="background:'+c[0]+';color:'+c[1]+(s?';width:'+s+'px;height:'+s+'px;font-size:'+Math.round(s*.36)+'px':'')+'">'+esc(ini(n))+'</span>';}
function pill(st){var c=SC[st]||SC['Новая'];return '<span class="pill" style="background:var('+c[0]+');color:var('+c[1]+')">'+esc(st)+'</span>';}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('show');},2300);}
function busy(on){$('busy').classList.toggle('on',on);if(!on){$('busy').style.width='100%';setTimeout(function(){$('busy').style.width='';},250);}}
function isLead(){return D&&D.me.lead;}
function mine(t){return t.exec===D.me.name;}
function isOpen(t){return t.status!=='Выполнено'&&t.status!=='Отменено';}
function dueTxt(t){if(t.left===null)return '';var l=t.left;if(!isOpen(t))return t.dueStr;if(l<0)return 'просрочено '+(-l)+' дн.';if(l===0)return 'сегодня';if(l===1)return 'завтра';if(l<=6)return 'через '+l+' дн.';return 'до '+t.dueStr;}

function api(act,p,ok,quiet){
  p=p||{};p.sp=statP;if(view==='stats'&&statMode==='res')p.rp=resP;busy(true);
  if(!LIVE){setTimeout(function(){var r=DEMO_ACT(act,p);busy(false);if(r&&r.error){toast(r.error);return;}D=r;render();ok&&ok();},200);return;}
  if(!quiet)haptic('light');
  call(act,p,function(r){busy(false);if(r&&r.error){haptic('error');toast(r.error);return;}D=r;render();if(r.msg&&!quiet){haptic('ok');toast(r.msg);}ok&&ok();},
   function(e){busy(false);haptic('error');toast('Нет связи. Попробуйте ещё раз');});
}
function boot(){
  if(!LIVE){if(typeof DEMO==='undefined'||!DEMO){$('load').innerHTML='<div class="ill" style="padding-top:120px">Откройте приложение через бота в Telegram.</div>';return;}D=DEMO_ACT('boot');start();return;}
  call('boot',{},function(r){if(r&&r.error){$('load').innerHTML='<div class="ill" style="padding-top:120px">'+esc(r.error)+'</div>';return;}D=r;start();},
   function(e){$('load').innerHTML='<div class="ill" style="padding-top:120px">Не удалось загрузить. Проверьте интернет и откройте приложение ещё раз.</div>';});
}
function start(){$('load').classList.add('hide');tf=isLead()?'all':'mine';render();setInterval(function(){if(!document.hidden&&!$('ov').classList.contains('show'))api('boot',{},null,true);},90000);}

function nav(){
  var items=[['home','Главная'],['tasks','Задачи'],['plus',''],['stats','Статистика']];
  if(isLead())items.push(['team','Команда']);else items.push(['profile','Профиль']);
  $('nav').innerHTML=items.map(function(x){if(x[0]==='plus')return '<button class="fab" onclick="openNew()" aria-label="Новая задача">'+ic('plus',24)+'</button>';
    return '<button class="'+(view===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')">'+ic(x[0])+x[1]+'</button>';}).join('');
}
function go(v){if(v!==view)haptic('sel');view=v;window.scrollTo(0,0);render();}
function render(){
  ['home','tasks','stats','team','profile'].forEach(function(v){$('v-'+v).classList.toggle('hide',v!==view);});
  nav();
  if(view==='home')renderHome();if(view==='tasks')renderTasks();if(view==='stats')renderStats();if(view==='team')renderTeam();if(view==='profile')renderProfile();
  if(openId&&$('ov').classList.contains('show')&&$('sheet').getAttribute('data-k')==='task')renderTask(openId);
  syncBack();
}

function ring(p,sz,dark){sz=sz||76;var r=sz/2-6,c=2*Math.PI*r,o=c*(1-Math.min(100,p||0)/100);
  return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 '+sz+' '+sz+'"><circle cx="'+sz/2+'" cy="'+sz/2+'" r="'+r+'" fill="none" stroke="'+(dark?'rgba(255,255,255,.22)':'var(--line)')+'" stroke-width="8"/><circle cx="'+sz/2+'" cy="'+sz/2+'" r="'+r+'" fill="none" stroke="'+(dark?'#5DCAA5':'var(--green)')+'" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+o.toFixed(1)+'" transform="rotate(-90 '+sz/2+' '+sz/2+')"/><text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="'+(dark?'#fff':'var(--ink)')+'" font-family="Inter,Arial">'+(p===null?'—':p+'%')+'</text></svg>';}

function row(t,showExec){
  var c=SC[t.status]||SC['Новая'];
  return '<div class="row" style="--st:var('+c[1]+')" onclick="openTask(\''+esc(t.id)+'\')"><span class="dot" style="background:'+(PC[t.prio]||'#B4B2A9')+'"></span><div class="main">'+
   '<div class="o"><span class="dot" style="background:'+(PC[t.prio]||'#B4B2A9')+'"></span>#'+esc(t.id)+' · '+esc(t.obj)+'</div><div class="ti">'+esc(t.title)+'</div>'+
   '<div class="meta">'+pill(t.status)+duePill(t)+(t.checkN?'<span class="pill" style="background:var(--soft);color:var(--mut)">'+ic('check',12)+' '+t.checkD+'/'+t.checkN+'</span>':'')+(showExec&&t.exec?'<span style="margin-left:auto">'+av(t.exec)+'</span>':'')+'</div>'+
   (t.progress&&isOpen(t)?'<div class="prog"><i style="width:'+t.progress+'%"></i></div>':'')+'</div></div>';
}

  var tiles=isLead()?[['В работе',open.filter(function(t){return t.status==='В работе';}).length,'--acc-bg','--acc','work'],['На проверке',open.filter(function(t){return t.status==='На проверке';}).length,'--amber-bg','--amber','review'],['Просрочено',late.length,late.length?'--red-bg':'--card',late.length?'--red':'--mut','late']]
   :[['Мои задачи',my.length,'--acc-bg','--acc','mine'],['На проверке',my.filter(function(t){return t.status==='На проверке';}).length,'--amber-bg','--amber','review'],['Просрочено',late.length,late.length?'--red-bg':'--card',late.length?'--red':'--mut','late']];
  html+='<div class="qs">'+tiles.map(function(x){return '<div onclick="tf=\''+x[4]+'\';go(\'tasks\')"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>';}).join('')+'</div></div>';
  html+=goalCard();
  if(!isLead()&&D.game&&D.game.profiles[D.me.row]){var g=D.game.profiles[D.me.row];html+='<div class="card" style="display:flex;align-items:center;gap:12px;margin-top:10px;cursor:pointer" onclick="go(\'profile\')"><div style="font-size:30px">🏅</div><div style="flex:1"><div style="font-weight:700">Уровень '+g.level+' · '+esc(g.levelName)+'</div><div class="sub">🔥 '+g.streak+' дн. без просрочек · '+g.badges.filter(function(b){return b.got;}).length+' наград</div><div class="bar"><i style="width:'+xpPct(g)+'%;background:var(--grad)"></i></div></div></div>';}
  if(isLead()){
    var rv=open.filter(function(t){return t.status==='На проверке';});
    if(rv.length)html+='<div class="sec"><b>Ждут вашей проверки</b><span onclick="tf=\'review\';go(\'tasks\')">Все</span></div>'+rv.slice(0,4).map(function(t){return row(t,true);}).join('');
  }
  html+='<div class="sec"><b>Срочно</b><span onclick="tf=\'hot\';go(\'tasks\')">Все</span></div>';
  html+=hot.length?hot.slice(0,5).map(function(t){return row(t,isLead());}).join(''):'<div class="card">'+emptyIll('Горящих задач нет — всё под контролем')+'</div>';
  var free=open.filter(function(t){return !t.exec&&t.status!=='Приостановлено';});
  if(free.length){
    html+='<div class="sec"><b>Свободные задачи</b><span onclick="tf=\'free\';go(\'tasks\')">'+free.length+'</span></div><div class="hs">'+free.slice(0,8).map(function(t){
      return '<div class="fcard"><div class="o" style="font-size:11.5px;color:var(--mut);font-weight:500">'+esc(t.obj)+'</div><div class="ti" onclick="openTask(\''+esc(t.id)+'\')">'+esc(t.title)+'</div><div style="display:flex;align-items:center;gap:6px">'+duePill(t)+(isLead()?'<button class="btn sm sec2" style="margin-left:auto" onclick="pickExec(\''+esc(t.id)+'\')">Назначить</button>':'<button class="btn sm pri" style="margin-left:auto" onclick="api(\'take\',{id:\''+esc(t.id)+'\'})">Взять</button>')+'</div></div>';}).join('')+'<div style="flex:none;width:4px"></div></div>';

var TF_EMP=[['mine','Мои'],['hot','Срочно'],['free','Свободные'],['review','На проверке'],['done','Сделано'],['all','Все']];
var TF_LEAD=[['all','Все'],['hot','Срочно'],['review','Проверка'],['wait','Ждут данных'],['free','Свободные'],['late','Просрочено'],['done','Закрытые']];
function filtered(){
  var T=D.tasks,ql=q.toLowerCase();
  var L=T.filter(function(t){
    if(tf==='done')return t.status==='Выполнено'&&(isLead()||mine(t));
    if(!isOpen(t))return false;
    if(tf==='mine'||tf==='work')return tf==='work'?t.status==='В работе':mine(t);
    if(tf==='free')return !t.exec&&t.status!=='Приостановлено';
    if(tf==='review')return t.status==='На проверке'&&(isLead()||mine(t));
    if(tf==='wait')return t.status==='Ждёт данных';
    if(tf==='late')return t.left!==null&&t.left<0&&(isLead()||mine(t));
    if(tf==='hot')return t.left!==null&&t.left<=2&&(isLead()||mine(t));
    if(/^p\d+$/.test(tf)){var m=D.team.filter(function(x){return 'p'+x.row===tf;})[0];return m&&t.exec===m.name;}
    return true;});
  if(ql)L=L.filter(function(t){return (t.id+' '+t.obj+' '+t.title+' '+t.exec+' '+t.desc).toLowerCase().indexOf(ql)>=0;});
  return L;
}
function renderTasks(){
  var F=isLead()?TF_LEAD:TF_EMP;if(/^p\d+$/.test(tf)){var m=D.team.filter(function(x){return 'p'+x.row===tf;})[0];F=F.concat([[tf,m?short(m.name):'']]);}
  var html='<div style="display:flex;align-items:center;justify-content:space-between"><h1>Задачи</h1><button class="btn sm sec2" onclick="boardMode=!boardMode;renderTasks()">'+ic(boardMode?'list':'board',16)+(boardMode?'Список':'Доска')+'</button></div>';
  html+='<div class="search">'+ic('search',18)+'<input id="q" placeholder="Поиск по задачам" value="'+esc(q)+'" oninput="q=this.value;renderTaskList()"></div>';
  html+='<div class="chips">'+F.map(function(x){return '<div class="chip'+(tf===x[0]?' on':'')+'" onclick="tf=\''+x[0]+'\';renderTasks()">'+x[1]+'</div>';}).join('')+'</div><div id="tl"></div>';
  $('v-tasks').innerHTML=html;renderTaskList();
}
function renderTaskList(){
  var L=filtered(),showExec=isLead()||tf==='free'||tf==='all';
  if(!L.length){$('tl').innerHTML=emptyIll(tf==='free'?'Свободных задач нет':tf==='late'?'Просроченных нет — отлично!':'Здесь пока пусто');return;}
  if(boardMode&&tf!=='done'){
    var cols=['Новая','В работе','Ждёт данных','На проверке','Приостановлено'];
    $('tl').innerHTML='<div class="board">'+cols.map(function(c){var cl=L.filter(function(t){return t.status===c;});if(!cl.length&&(c==='Приостановлено'||c==='Ждёт данных'))return '';
      return '<div class="col"><div class="colh">'+pill(c)+'<span class="n">'+cl.length+'</span></div>'+(cl.length?cl.map(function(t){return row(t,showExec);}).join(''):'<div class="empty" style="padding:18px 0">—</div>')+'</div>';}).join('')+'</div>';
    return;
  }
  if(tf==='done'){L.sort(function(a,b){return (b.doneS||0)-(a.doneS||0);});$('tl').innerHTML=L.map(function(t){return row(t,showExec);}).join('');return;}
  var G=[['Просрочено',function(t){return t.left!==null&&t.left<0;}],['Сегодня',function(t){return t.left===0;}],['Завтра',function(t){return t.left===1;}],['На этой неделе',function(t){return t.left!==null&&t.left>1&&t.left<=7;}],['Позже',function(t){return t.left!==null&&t.left>7;}],['Без срока',function(t){return t.left===null;}]];
  L.sort(function(a,b){return (a.left===null?1e9:a.left)-(b.left===null?1e9:b.left);});
  $('tl').innerHTML=G.map(function(g){var gl=L.filter(g[1]);if(!gl.length)return '';return '<div class="grp">'+g[0]+' · '+gl.length+'</div>'+gl.map(function(t){return row(t,showExec);}).join('');}).join('');
}

function emptyIll(t){return '<div class="ill"><svg width="120" height="92" viewBox="0 0 120 92" fill="none"><rect x="14" y="10" width="78" height="62" rx="14" fill="var(--acc-bg)" transform="rotate(-8 53 41)"/><rect x="26" y="16" width="78" height="62" rx="14" fill="var(--card)" stroke="var(--line)" stroke-width="2"/><rect x="38" y="30" width="14" height="14" rx="4" fill="var(--green)"/><path d="M41.5 37l2.5 2.5 4.5-5" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="58" y="33" width="34" height="7" rx="3.5" fill="var(--line)"/><rect x="38" y="52" width="14" height="14" rx="4" fill="none" stroke="var(--fnt)" stroke-width="2"/><rect x="58" y="55" width="26" height="7" rx="3.5" fill="var(--line)"/><circle cx="104" cy="14" r="6" fill="var(--violet-bg)"/><circle cx="12" cy="76" r="4" fill="var(--amber-bg)"/></svg><div>'+esc(t)+'</div></div>';}
function openSheet(html,k){$('sheet').innerHTML='<div class="grab"></div>'+html;$('sheet').setAttribute('data-k',k||'');if(!$('ov').classList.contains('show'))haptic('light');$('ov').classList.add('show');$('sheet').scrollTop=0;syncBack();}
function closeSheet(){$('ov').classList.remove('show');openId=null;syncBack();}
function T(id){return D.tasks.filter(function(t){return String(t.id)===String(id);})[0];}
function openTask(id){openId=id;openSheet('','task');renderTask(id);}
function renderTask(id){
  var t=T(id);if(!t){closeSheet();return;}
  var lead=isLead(),my=mine(t),op=isOpen(t),can=op&&(my||lead);
  var h='<div style="display:flex;justify-content:space-between;align-items:center"><div class="sub">#'+esc(t.id)+' · '+esc(t.obj)+'</div><button class="btn sm sec2" onclick="closeSheet()">Закрыть</button></div>';
  h+='<div style="font-size:19px;font-weight:600;line-height:1.35;margin:8px 0 4px;letter-spacing:-.2px">'+esc(t.title)+'</div>';
  if(t.desc)h+='<div style="color:var(--mut);font-size:13.5px;line-height:1.55;white-space:pre-wrap;margin-top:6px">'+esc(t.desc)+'</div>';
  h+='<div class="kv"><div class="c" '+(lead&&op?'onclick="pickStatus(\''+esc(id)+'\')"':'')+'><div class="k">Статус</div><div class="v">'+pill(t.status)+'</div></div>'+
     '<div class="c" '+(lead&&op?'onclick="pickPrio(\''+esc(id)+'\')"':'')+'><div class="k">Приоритет</div><div class="v"><span class="dot" style="display:inline-block;background:'+(PC[t.prio]||'#B4B2A9')+';margin-right:6px"></span>'+esc(t.prio||'—')+'</div></div>'+
     '<div class="c" '+(lead&&op?'onclick="pickExec(\''+esc(id)+'\')"':'')+'><div class="k">Исполнитель</div><div class="v" style="display:flex;align-items:center;gap:6px">'+av(t.exec)+esc(t.exec?short(t.exec):'не назначен')+'</div></div>'+
     '<div class="c" '+(op&&(lead||my)?'onclick="pickDue(\''+esc(id)+'\')"':'')+'><div class="k">Срок</div><div class="v">'+(t.dueStr?esc(t.dueStr)+' <span style="color:'+(t.left<0&&op?'var(--red)':'var(--mut)')+';font-weight:500;font-size:12px">'+dueTxt(t)+'</span>':'без срока')+'</div></div>'+
     '<div class="c"><div class="k">Затрачено</div><div class="v">'+(t.hours?String(t.hours).replace('.',',')+' ч':'—')+'</div></div>'+
     '<div class="c" '+(can?'onclick="pickPlan(\''+esc(id)+'\')"':'')+'><div class="k">Оценка</div><div class="v">'+(t.plan?t.plan+' дн.':'—')+(t.type?' <span style="color:var(--mut);font-weight:500;font-size:12px">'+esc(t.type)+'</span>':'')+'</div></div></div>';
  if(t.link)h+='<a class="btn sec2 wide" style="margin-top:8px;text-decoration:none" href="'+esc(t.link)+'" target="_blank">🔗 Открыть материалы</a>';
  // действия
  var A=[];
  if(op&&!t.exec)A.push(lead?['Назначить','acc',"pickExec('"+id+"')"]:['🙋 Взять себе','pri',"api('take',{id:'"+id+"'})"]);
  if(can){

  if(op)h+='<div style="display:flex;gap:8px;margin-top:8px"><input class="inp" id="cmt" placeholder="'+(lead||!my?'Комментарий':'Комментарий или вопрос руководителю')+'" onkeydown="if(event.key===\'Enter\')sendCm(\''+esc(id)+'\')"><button class="btn pri" onclick="sendCm(\''+esc(id)+'\')">↑</button></div>';
  if(op&&my&&!lead)h+='<div class="mini" style="margin-top:12px"><button class="btn sm sec2" onclick="askExt(\''+esc(id)+'\')">📅 Попросить перенос срока</button><button class="btn sm sec2" onclick="askLink(\''+esc(id)+'\')">🔗 Добавить ссылку</button></div>';

function choose(title,sub,opts,cb){

function bars(w,color){var max=Math.max.apply(null,w.concat([1])),W=320,H=90,n=w.length,bw=24,g=(W-n*bw)/(n-1);

function renderResults(){
  var r=D.results,P=[['m','Месяц'],['pm','Прошлый'],['q','Квартал'],['y','Год'],['a','Всё']];
  var h='<div class="top" style="background:radial-gradient(420px 260px at 100% -20%,rgba(93,202,165,.75),transparent 60%),linear-gradient(135deg,#085041,#1F3B8C)"><div class="tag"><i></i>Результаты</div><h1>'+(isLead()?'Результаты команды':'Мои результаты')+'</h1><div class="sub">'+(r?esc(r.label)+' · все выполненные задачи':'Загрузка…')+'</div></div>';
  h+=modeSeg()+'<div class="seg" style="margin-top:8px">'+P.map(function(p){return '<button class="'+(resP===p[0]?'on':'')+'" onclick="loadRes(\''+p[0]+'\')">'+p[1]+'</button>';}).join('')+'</div>';
  if(!r||r.pk!==resP){$('v-stats').innerHTML=h+'<div class="ill"><div class="spin"></div></div>';return;}
  var K=[[r.total,'Выполнено задач'],[r.onTime===null?'—':r.onTime+'%','Сдано в срок'],[r.avgDays===null?'—':String(r.avgDays).replace('.',','),'Среднее время, дн.'],[String(r.hours).replace('.',','),'Учтено часов'],[r.objectsN,'Объектов'],[r.allTime,'Всего за всё время']];
  h+='<div class="big" style="margin-top:10px">'+K.map(function(k,i){return '<div class="c"><div class="v" style="'+(i===0?'color:var(--green)':'')+'">'+k[0]+'</div><div class="k">'+k[1]+'</div></div>';}).join('')+'</div>';
  h+='<div class="sec"><b>По месяцам</b><span style="color:var(--mut)">12 мес.</span></div><div class="card">'+mbars(r.months)+'</div>';
  if(isLead()&&r.people.length)h+='<div class="sec"><b>Команда</b></div>'+r.people.map(function(p){var na=p.name==='Не указан';return '<div class="person">'+(na?'<span class="av" style="width:40px;height:40px;background:var(--gray-bg);color:var(--fnt)">—</span>':av(p.name,40))+'<div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:8px"><b style="font-weight:600">'+esc(na?'Без исполнителя':p.name)+'</b><b>'+p.done+'</b></div><div class="sub">'+(na?'задачи из старого списка':'доля '+p.share+'% · в срок '+(p.onTime===null?'—':p.onTime+'%')+(p.avg!==null?' · ср. '+String(p.avg).replace('.',',')+' дн.':''))+'</div></div></div>';}).join('');
  h+='<div class="sec"><b>Объекты</b></div><div class="card">'+hb(r.objects,'#7F77DD',8)+'</div>';
  h+='<div class="sec"><b>Виды работ</b></div><div class="card">'+hb(r.types,'#EF9F27',8)+'</div>';
  h+='<div class="acts"><button class="btn pri" onclick="api(\'resPdf\',{})">📄 PDF в Telegram</button>'+(isLead()&&D.reportUrl?'<a class="btn sec2" style="text-decoration:none" href="'+esc(D.reportUrl)+'" target="_blank">🌐 Отчёт для руководства</a>':'')+'</div>';
  h+='<div class="sec"><b>Выполненные задачи</b><span style="color:var(--mut)">'+r.total+'</span></div><div class="search">'+ic('search',18)+'<input placeholder="Поиск" value="'+esc(rq)+'" oninput="rq=this.value;renderResList()"></div><div id="rl"></div>';
  $('v-stats').innerHTML=h;renderResList();
}
function renderResList(){var r=D.results,q=rq.toLowerCase(),M=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'],cur=null,h='';
  var L=r.tasks.filter(function(t){return !q||(t.id+' '+t.obj+' '+t.title+' '+t.exec).toLowerCase().indexOf(q)>=0;});
  if(!L.length){$('rl').innerHTML=emptyIll('Выполненных задач нет');return;}
  L.slice(0,300).forEach(function(t){var g=t.done?M[Number(t.done.slice(3,5))-1]+' '+t.done.slice(6):'Без даты';if(g!==cur){cur=g;h+='<div class="grp">'+g+'</div>';}
    h+='<div class="row" style="cursor:default"><span class="dot" style="background:var(--green)"></span><div class="main"><div class="o">#'+esc(t.id)+' · '+esc(t.obj)+'</div><div class="ti">'+esc(t.title)+'</div><div class="meta"><span class="pill" style="background:var(--green-bg);color:var(--green)">'+(t.done?'✓ '+t.done.slice(0,5):'✓ выполнено')+'</span>'+(t.onTime===false?'<span class="pill" style="background:var(--red-bg);color:var(--red)">не в срок</span>':'')+(t.type?'<span class="pill" style="background:var(--soft);color:var(--mut)">'+esc(t.type)+'</span>':'')+(isLead()&&t.exec?'<span style="margin-left:auto">'+av(t.exec)+'</span>':'')+'</div></div></div>';});
  $('rl').innerHTML=h;}

function renderTeam(){
  var G=D.game||{team:[]},byRow={};G.team.forEach(function(x){byRow[x.row]=x;});
  var h='<h1>Команда</h1><div class="sub">Лимит одновременно в работе: '+D.wip+'</div>';
  h+=goalCard(true);
  var hero=G.team.slice().sort(function(a,b){return b.weekXp-a.weekXp;})[0];
  if(hero&&hero.weekXp)h+='<div class="card" style="margin-top:10px;display:flex;gap:12px;align-items:center"><div style="font-size:30px">🦸</div><div><div class="sub">Герой недели</div><div style="font-weight:700">'+esc(hero.name)+' · +'+hero.weekXp+' опыта</div></div></div>';
  h+='<div class="acts"><button class="btn acc" onclick="pickWotw()">🏆 Работа недели</button><button class="btn sec2" onclick="thanksPick()">💛 Поблагодарить</button></div>';
  h+='<div class="sec"><b>Сотрудники</b></div>';
  h+=D.team.filter(function(m){return !m.lead;}).map(function(m){var g=byRow[m.row]||{};var pct=Math.min(100,Math.round(m.work/D.wip*100));
    return '<div class="person" onclick="openProfile('+m.row+')">'+av(m.name,42)+'<div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:8px"><b style="font-weight:700">'+esc(m.name)+'</b><span class="pill" style="background:var(--violet-bg);color:var(--violet)">ур. '+(g.level||1)+'</span></div>'+
      '<div class="sub">'+esc(g.levelName||m.pos)+' · 🔥 '+(g.streak||0)+' · 🏅 '+(g.badgesN||0)+' · ⭐ '+(g.quality==null?'—':String(g.quality).replace('.',','))+'</div>'+
      '<div class="bar"><i style="width:'+pct+'%;background:'+(m.work>=D.wip?'#E24B4A':'#378ADD')+'"></i></div><div class="sub" style="margin-top:5px">в работе '+m.work+'/'+D.wip+' · всего '+m.active+(m.overdue?' · <b style="color:var(--red)">просрочено '+m.overdue+'</b>':'')+'</div></div></div>';}).join('');
  h+='<div class="sec"><b>Объявление команде</b></div><textarea class="inp" id="ann" placeholder="Например: завтра планёрка в 10:00"></textarea><button class="btn pri wide" style="margin-top:8px" onclick="var v=$(\'ann\').value.trim();if(v)api(\'announce\',{text:v});">Отправить всем в Telegram</button>';
  $('v-team').innerHTML=h;
}
function goalCard(edit){var g=D.game&&D.game.goal;if(!g)return '';
  return '<div class="card goal" style="margin-top:10px"'+(edit?' onclick="editGoal()"':'')+'><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:15px">🎯 Цель команды · '+esc(g.label.split(' ')[0])+'</b><span class="sub">'+(edit?'изменить':g.pct+'%')+'</span></div>'+
    '<div class="gb"><i style="width:'+g.pct+'%"></i></div><div class="sub"><b style="color:var(--ink)">'+g.done+' / '+g.tasks+'</b> задач · в срок '+(g.ot===null?'—':g.ot+'%')+' (цель '+g.ontime+'%)'+(g.reward?' · 🎁 '+esc(g.reward):'')+(g.reached?' · <b style="color:var(--green)">выполнено!</b>':'')+'</div></div>';}
function editGoal(){var g=D.game.goal;ask('Цель на месяц: задач, % в срок, награда','Например: 45 90 командный обед',function(v){var m=v.match(/(\d+)\D+(\d+)\s*%?\s*(.*)/)||v.match(/(\d+)()(.*)/);if(!m){toast('Например: 45 90 обед');return;}api('goal',{tasks:Number(m[1]),ontime:Number(m[2])||85,reward:(m[3]||'').trim()});});}
function pickWotw(){var w=(D.game&&D.game.week)||[];if(!w.length){toast('За неделю нет выполненных задач');return;}choose('Работа недели','Автор получит награду, команда — объявление',w.map(function(t){return [short(t.exec||'—')+' · '+t.obj+' — '+t.title,t.id];}),function(v){api('wotw',{id:v});});}
function thanksPick(){choose('Кого поблагодарить?','',D.team.filter(function(m){return m.name!==D.me.name;}).map(function(m){return [m.name,String(m.row)];}),function(r){thanksText({row:Number(r)});});}
function thanksTask(id){thanksText({id:id});}
function thanksText(p){var Q=(D.game&&D.game.quick)||['Спасибо!'];choose('Благодарность','',Q.map(function(q){return [q,q];}).concat([['✏️ Написать своё','__own']]),function(v){
  if(v==='__own'){ask('Ваша благодарность','За что спасибо?',function(t){p.text=t;api('thanks',p);});return;}p.text=v;api('thanks',p);});}
function acceptT(id){openSheet('<div style="font-size:18px;font-weight:700;margin:4px 2px 4px">Принять задачу</div><div class="sub" style="margin:0 2px 12px">Оцените качество — это влияет на опыт и награды сотрудника</div><div class="card"><div class="star" id="stars">'+[1,2,3,4,5].map(function(n){return '<span data-n="'+n+'" style="color:var(--line)">★</span>';}).join('')+'</div></div><div class="acts"><button class="btn sec2" id="st0">Без оценки</button><button class="btn grn" id="st1">Принять</button></div>','stars');
  var cur=0;function paint(){Array.prototype.forEach.call($('stars').children,function(e){e.style.color=Number(e.getAttribute('data-n'))<=cur?'#F5B83D':'var(--line)';});}
  Array.prototype.forEach.call($('stars').children,function(e){e.onclick=function(){cur=Number(e.getAttribute('data-n'));paint();haptic('sel');};});
  $('st0').onclick=function(){back();api('accept',{id:id,stars:0});};$('st1').onclick=function(){if(!cur){toast('Выберите звёзды или «Без оценки»');return;}back();api('accept',{id:id,stars:cur});};}
function xpPct(g){return g.next?Math.round((g.xp-g.cur)/(g.next-g.cur)*100):100;}
function openProfile(row){profRow=row;view='profile';window.scrollTo(0,0);render();}
function renderProfile(){
  var row=isLead()?profRow:D.me.row,g=D.game&&D.game.profiles[row];
  if(!g){$('v-profile').innerHTML=emptyIll('Профиль появится после первой выполненной задачи');return;}
  var got=g.badges.filter(function(b){return b.got;}).length;
  var h=(isLead()?'<button class="btn sm sec2" style="margin-bottom:10px" onclick="go(\'team\')">← Команда</button>':'');
  h+='<div class="top pf"><div class="tag"><i></i>Профиль</div><h1>'+esc(g.name)+'</h1><div class="sub">'+esc(g.pos||'')+'</div>'+
    '<div style="margin-top:12px"><span class="lvl">🏅 Уровень '+g.level+' · '+esc(g.levelName)+'</span></div>'+
    '<div class="sub" style="margin-top:10px">'+g.xp+(g.next?' / '+g.next+' опыта до уровня '+(g.level+1):' опыта · максимальный уровень')+'</div><div class="xp"><i style="width:'+xpPct(g)+'%"></i></div>'+
    '<div class="qs"><div><b>🔥 '+g.streak+'</b><span>дней без просрочек</span></div><div><b>⭐ '+(g.quality==null?'—':String(g.quality).replace('.',','))+'</b><span>качество</span></div><div><b>💛 '+g.thanksN+'</b><span>благодарностей</span></div></div></div>';
  h+=goalCard(false);
  h+='<div class="sec"><b>Награды</b><span style="color:var(--mut)">'+got+' из '+g.badges.length+'</span></div><div class="bdg">'+g.badges.slice().sort(function(a,b){return b.got-a.got;}).map(function(b){return '<div class="bd '+(b.got?'on':'off')+'" onclick="toast(\''+esc(b.n).replace(/'/g,'')+': '+esc(b.d).replace(/'/g,'')+(b.got?' ✓':' · '+b.prog)+'\')"><i>'+b.e+'</i>'+esc(b.n)+'</div>';}).join('')+'</div>';
  if(g.skills.length)h+='<div class="sec"><b>Навыки</b></div><div class="card">'+g.skills.slice(0,6).map(function(s){return '<div class="sk2"><div style="display:flex;justify-content:space-between;font-size:13.5px"><span>'+esc(s.type)+'</span><b>ур. '+s.level+'</b></div><div class="bar"><i style="width:'+s.pct+'%"></i></div><div class="sub" style="font-size:11.5px;margin-top:3px">'+s.n+' задач · '+s.xp+' опыта</div></div>';}).join('')+'</div>';
  h+='<div class="sec"><b>Благодарности</b>'+(g.name!==D.me.name?'<span onclick="thanksText({row:'+g.row+'})">💛 Поблагодарить</span>':'<span onclick="thanksPick()">💛 Коллеге</span>')+'</div><div class="card" style="padding:4px 14px">'+(g.thanks.length?g.thanks.map(function(x){return '<div class="ty"><div style="font-size:20px">💛</div><div><b>'+esc(short(x.from))+'</b> <span class="sub">'+esc(x.when)+'</span><div>'+esc(x.text)+'</div></div></div>';}).join(''):'<div class="ty" style="color:var(--fnt)">Пока нет — всё впереди</div>')+'</div>';
  h+='<div class="sec"><b>Портфолио</b><span style="color:var(--mut)">'+g.doneN+'</span></div>'+(g.portfolio.length?g.portfolio.slice(0,30).map(function(t){return '<div class="row" style="--st:var(--green);cursor:default"><div class="main"><div class="o">#'+esc(t.id)+' · '+esc(t.obj)+'</div><div class="ti">'+esc(t.title)+'</div><div class="meta"><span class="pill" style="background:var(--green-bg);color:var(--green)">✓ '+esc(t.done||'выполнено')+'</span>'+(t.stars?'<span class="pill" style="background:var(--amber-bg);color:var(--amber)">'+'★'.repeat(t.stars)+'</span>':'')+(t.link?'<a class="pill" style="background:var(--acc-bg);color:var(--acc);text-decoration:none" href="'+esc(t.link)+'" target="_blank">🔗 файл</a>':'')+'</div></div></div>';}).join(''):emptyIll('Здесь появятся выполненные задачи'));
  if(isLead())h+='<button class="btn sec2 wide" style="margin-top:12px" onclick="tf=\'p'+g.row+'\';go(\'tasks\')">Задачи сотрудника</button>';
  $('v-profile').innerHTML=h;
}
</script>
<script>
var DEMO=null;function DEMO_ACT(){return {};}
boot();
</script>
