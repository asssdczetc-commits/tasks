<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Задачи</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#ECE7DF;--card:#F7F4EF;--card2:#E6DFD4;--solid:#FBF9F6;--ink:#23241E;--mut:rgba(35,36,30,.60);--fnt:rgba(35,36,30,.36);--line:rgba(70,58,40,.10);--soft:rgba(90,76,56,.075);
--acc:#424C36;--acc-bg:rgba(66,76,54,.11);--on-acc:#F7F4EF;--blue:#4D6A80;--blue-bg:rgba(77,106,128,.12);--green:#5E7C44;--green-bg:rgba(94,124,68,.14);--red:#B24F38;--red-bg:rgba(178,79,56,.11);--amber:#A6771E;--amber-bg:rgba(201,150,50,.16);
--violet:#77628E;--violet-bg:rgba(119,98,142,.12);--coral:#B5663A;--coral-bg:rgba(181,102,58,.12);--gray-bg:rgba(90,76,56,.10);
--hl:rgba(255,255,255,.7);--rim:rgba(255,255,255,.5);--shadow:0 1px 2px rgba(60,46,28,.05),0 10px 26px -14px rgba(60,46,28,.22);
--sheet:#F2EEE8;--glass:#FBF9F6;--grad:linear-gradient(90deg,#5E7C44,#93A877);--gold:#C08A2E;--il:1}
[data-theme=dark]{--bg:#161512;--card:#22201C;--card2:#2B2823;--solid:#2A2723;--ink:#EEE8DD;--mut:rgba(238,232,221,.60);--fnt:rgba(238,232,221,.32);--line:rgba(255,245,230,.08);--soft:rgba(255,245,230,.06);
--acc:#B3C09A;--acc-bg:rgba(179,192,154,.15);--on-acc:#1C1F17;--blue:#93B2C9;--blue-bg:rgba(147,178,201,.15);--green:#A0BD80;--green-bg:rgba(160,189,128,.15);--red:#E58C72;--red-bg:rgba(229,140,114,.15);--amber:#DDB25F;--amber-bg:rgba(221,178,95,.15);
--violet:#B9A5D2;--violet-bg:rgba(185,165,210,.15);--coral:#E39C6E;--coral-bg:rgba(227,156,110,.15);--gray-bg:rgba(255,245,230,.09);
--hl:rgba(255,255,255,.06);--rim:rgba(255,255,255,.04);--shadow:inset 0 1px 0 rgba(255,255,255,.04),0 12px 28px -16px rgba(0,0,0,.7);
--sheet:#1E1C19;--glass:#25231F;--grad:linear-gradient(90deg,#86A566,#B3C09A);--gold:#DDB25F;--il:.82}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Manrope,-apple-system,BlinkMacSystemFont,'SF Pro Text',Inter,Roboto,'Helvetica Neue',Arial,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;letter-spacing:-.2px}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--ink)}
.app{max-width:560px;margin:0 auto;padding:10px 16px calc(112px + env(safe-area-inset-bottom));min-height:100vh}
.hide{display:none!important}
section{animation:rise .38s cubic-bezier(.2,.9,.25,1.05)}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
h1{font-size:32px;font-weight:800;letter-spacing:-1.1px;margin:2px 0 4px;line-height:1.1}
.sub{color:var(--mut);font-size:13.5px}
.eyebrow{font-size:12.5px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:26px 4px 10px}
.sec b{font-size:20px;font-weight:800;letter-spacing:-.6px}
.sec span{color:var(--ink);opacity:.75;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.gl,.card,.row,.fcard,.kv .c,.person,.big .c,.search,.chip,.col,.btn.sec2,.top,.qs div,.inp{background:var(--card);box-shadow:var(--shadow)}
.card{border-radius:26px;padding:16px}
.hero{display:flex;gap:16px;align-items:center;margin-top:14px}
.top{position:relative;overflow:hidden;border-radius:30px;padding:18px;margin:0 0 6px;background:var(--card)!important;color:var(--ink)}
.top:before{display:none}
.top>*{position:relative;z-index:1}
.top h1{color:var(--ink);font-size:30px}
.top .sub{color:var(--mut)}
.top .tag{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--soft);font-size:11.5px;font-weight:600;color:var(--mut);margin-bottom:8px;text-transform:none;letter-spacing:0}
.top .tag i{width:7px;height:7px;border-radius:50%;background:var(--green)}
.top .glass{display:flex;gap:14px;align-items:center;margin-top:12px;padding:12px;border-radius:22px;background:var(--soft)}
.top .glass .t1{font-weight:600;font-size:16px}.top .glass .t2{font-size:13px;color:var(--mut);margin-top:3px;line-height:1.45}
.qs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.qs div{padding:13px 13px 11px;border-radius:22px;cursor:pointer;transition:transform .25s cubic-bezier(.2,.9,.3,1.4)}
.qs div:active{transform:scale(.94)}
.qs b{display:block;font-size:28px;font-weight:700;letter-spacing:-.8px;line-height:1.1}
.qs span{font-size:12.5px;color:var(--mut);font-weight:500}
.rings{display:flex;align-items:center;gap:18px;padding:18px;border-radius:30px;margin-top:14px}
.rl{flex:1;display:flex;flex-direction:column;gap:11px}
.rl div{line-height:1.2}
.rl small{display:block;font-size:12.5px;font-weight:600;color:var(--mut)}
.rl b{font-size:21px;font-weight:700;letter-spacing:-.5px}
.rl b em{font-style:normal;font-size:13px;font-weight:600;color:var(--mut);margin-left:2px}
.row{position:relative;display:flex;align-items:flex-start;gap:12px;padding:14px 15px 14px 20px;border-radius:24px;margin-bottom:10px;cursor:pointer;transition:transform .25s cubic-bezier(.2,.9,.3,1.4);overflow:hidden}
.row:active{transform:scale(.975)}
.row:before{content:'';position:absolute;left:8px;top:16px;bottom:16px;width:4px;border-radius:4px;background:var(--st,#8E8E93)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.row>.dot{display:none}
.row .main{flex:1;min-width:0}
.row .o{font-size:12.5px;color:var(--mut);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.row .ti{font-weight:600;font-size:16px;line-height:1.32;margin-top:3px;letter-spacing:-.3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .meta{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;white-space:nowrap}
.av{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;flex:none;box-shadow:0 0 0 2px var(--hl)}
.prog{height:5px;background:var(--gray-bg);border-radius:3px;overflow:hidden;margin-top:11px}
.prog i{display:block;height:100%;background:var(--green);border-radius:3px}
.hs{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px;margin:0 -16px;padding-left:16px;scrollbar-width:none;scroll-snap-type:x mandatory}
.hs::-webkit-scrollbar{display:none}
.fcard{flex:none;width:248px;border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:8px;scroll-snap-align:start}
.fcard .ti{font-weight:600;font-size:15.5px;line-height:1.33;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;letter-spacing:-.3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:13px 18px;font-weight:600;font-size:15px;transition:transform .25s cubic-bezier(.2,.9,.3,1.4),opacity .15s;letter-spacing:-.2px}
.btn:active{transform:scale(.95)}
.btn.pri{background:var(--acc);color:var(--on-acc);box-shadow:0 8px 18px -10px var(--acc)}
.btn.acc{background:var(--acc);color:var(--on-acc);box-shadow:0 8px 18px -10px var(--acc)}
.btn.grn{background:var(--green);color:var(--on-acc);box-shadow:0 8px 18px -10px var(--green)}
.btn.sec2{color:var(--ink)}
.btn.sm{padding:8px 14px;font-size:14px}
.btn.wide{width:100%}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;padding:8px 12px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--mut);white-space:nowrap;transition:all .25s}
.seg button.on{background:var(--solid);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.search{display:flex;align-items:center;gap:8px;border-radius:999px;padding:11px 16px;margin:12px 0 10px;color:var(--fnt)}
.search input{border:none;outline:none;background:none;flex:1;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:3px 1px 6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 15px;border-radius:999px;font-size:14px;font-weight:600;color:var(--mut);cursor:pointer;transition:all .2s}
.chip.on{background:var(--acc);color:var(--on-acc);box-shadow:0 6px 16px -8px var(--acc)}
.board{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:4px 16px 10px;scroll-snap-type:x mandatory;scroll-padding:0 16px;scrollbar-width:none}
.board::-webkit-scrollbar{display:none}
.col{flex:none;width:85%;max-width:340px;scroll-snap-align:start;border-radius:28px;padding:10px}
.col .row{box-shadow:inset 0 0 0 1px var(--rim)}
.colh{display:flex;align-items:center;gap:8px;font-weight:700;margin:4px 6px 10px}
.colh .n{color:var(--fnt);font-weight:600}
.grp{font-size:13px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.3px;margin:22px 8px 9px}
.empty{text-align:center;color:var(--fnt);padding:36px 0}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 12px calc(10px + env(safe-area-inset-bottom));z-index:20;pointer-events:none}
.nav .in{pointer-events:auto;display:flex;width:100%;max-width:460px;justify-content:space-between;align-items:center;background:var(--glass);border-radius:30px;padding:8px 6px 7px;box-shadow:0 18px 40px -16px rgba(40,30,15,.35),0 0 0 1px var(--line)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mut);flex:1;padding:0;transition:color .2s}
.nav button .ni{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .3s cubic-bezier(.2,.9,.3,1.3)}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--ink)}
.nav button.on .ni{background:var(--acc);color:var(--on-acc);box-shadow:0 8px 16px -8px var(--acc)}
.nav button:active .ni{transform:scale(.88)}
.nav .bdn{position:absolute;top:0;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--acc);color:var(--on-acc);font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--glass)}
.nav button.on .bdn{background:var(--red);color:#fff}
.ov{position:fixed;inset:0;background:rgba(30,24,14,.34);z-index:40;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.ov.show{opacity:1;pointer-events:auto}
.sheet{background:var(--sheet);width:100%;max-width:560px;max-height:93vh;overflow-y:auto;border-radius:34px 34px 0 0;padding:8px 16px calc(26px + env(safe-area-inset-bottom));transform:translateY(60px);transition:transform .45s cubic-bezier(.2,.95,.25,1.08);box-shadow:inset 0 1px 0 var(--hl)}
.ov.show .sheet{transform:none}
.sheet .card,.sheet .kv .c,.sheet .row,.sheet .inp,.sheet .btn.sec2{background:var(--solid);-webkit-backdrop-filter:none;backdrop-filter:none}
[data-theme=dark] .sheet .card,[data-theme=dark] .sheet .kv .c,[data-theme=dark] .sheet .inp,[data-theme=dark] .sheet .btn.sec2{background:var(--card2)}
.grab{width:38px;height:5px;border-radius:3px;background:var(--fnt);margin:4px auto 14px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.kv .c{border-radius:20px;padding:12px 14px;cursor:pointer}
.kv .k{font-size:12.5px;color:var(--mut);font-weight:500}
.kv .v{font-weight:600;margin-top:3px;font-size:15px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border:none}
.box{width:23px;height:23px;border-radius:50%;border:2px solid var(--fnt);flex:none;display:flex;align-items:center;justify-content:center;margin-top:-1px;transition:all .25s cubic-bezier(.2,.9,.3,1.4)}
.chk.d .box{background:var(--green);border-color:var(--green);transform:scale(1.05)}
.chk.d span{color:var(--fnt);text-decoration:line-through}
.chk.d span.av,.chk.d span.sub{text-decoration:none}.chk.d span.sub{color:var(--mut)}
.cm{padding:12px 15px;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.45}
.cm:last-child{border:none}
.cm .w{font-size:12px;color:var(--fnt);font-weight:600;margin-bottom:2px}
.field{margin-top:18px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:0 6px 7px}
.inp{width:100%;border:none;border-radius:18px;padding:13px 15px;outline:none;font-size:16px;transition:box-shadow .2s}
.inp:focus{box-shadow:var(--shadow),0 0 0 3px var(--acc-bg)}
textarea.inp{min-height:84px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--green)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.acts .btn{flex:1;min-width:130px}
.mini{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(108px + env(safe-area-inset-bottom));transform:translate(-50%,16px) scale(.96);background:var(--acc);color:var(--on-acc);padding:12px 20px;border-radius:999px;font-size:14.5px;font-weight:600;opacity:0;transition:all .4s cubic-bezier(.2,.95,.25,1.2);z-index:60;max-width:88%;text-align:center;pointer-events:none;box-shadow:0 14px 36px -12px rgba(0,0,0,.35),inset 0 1px 0 var(--hl),inset 0 0 0 1px var(--rim)}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.person{display:flex;align-items:center;gap:13px;border-radius:24px;padding:14px 15px;margin-bottom:10px;cursor:pointer;transition:transform .25s cubic-bezier(.2,.9,.3,1.4)}
.person:active{transform:scale(.975)}
.person .av{width:46px;height:46px;font-size:15px}
.bar{height:6px;background:var(--gray-bg);border-radius:3px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:3px}
.big{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.big .c{border-radius:24px;padding:15px 16px}
.big .v{font-size:28px;font-weight:700;letter-spacing:-.8px}
.big .k{font-size:13px;color:var(--mut);margin-top:2px;font-weight:500}
.ill{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--fnt);padding:26px 0;text-align:center;font-weight:500}
.load{position:fixed;inset:0;background:var(--bg);z-index:80;padding:18px 16px}
.sk{border-radius:26px;background:linear-gradient(90deg,var(--soft) 25%,var(--gray-bg) 50%,var(--soft) 75%);background-size:300% 100%;animation:sh 1.3s infinite;margin-bottom:12px}
@keyframes sh{from{background-position:100% 0}to{background-position:0 0}}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--acc);animation:sp .8s linear infinite;margin:20px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.busy{position:fixed;top:0;left:0;height:3px;background:var(--acc);width:0;z-index:90;transition:width .6s;border-radius:0 3px 3px 0}
.busy.on{width:70%}
.pf .xp{height:10px;border-radius:5px;background:var(--gray-bg);margin-top:10px;overflow:hidden}
.pf .xp i{display:block;height:100%;background:var(--grad);border-radius:5px}
.lvl{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--acc-bg);color:var(--acc);font-size:13px;font-weight:700}
.bdg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px}
.bd{text-align:center;font-size:11.5px;font-weight:600;color:var(--mut);line-height:1.25;cursor:pointer}
.bd i{display:flex;width:58px;height:58px;margin:0 auto 7px;border-radius:50%;align-items:center;justify-content:center;font-size:27px;font-style:normal;background:var(--card);box-shadow:var(--shadow);transition:transform .3s cubic-bezier(.2,.9,.3,1.5)}
.bd:active i{transform:scale(.9)}
.bd.on i{background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.75),transparent 45%),linear-gradient(140deg,#F1DEB4,#D9B57A 55%,#B9C79B);box-shadow:0 8px 20px -8px rgba(160,120,50,.55),inset 0 1px 0 rgba(255,255,255,.7)}
.bd.off i{filter:grayscale(1);opacity:.35}
.bd.off{color:var(--fnt)}
.goal{position:relative;overflow:hidden}
.goal .gb{height:10px;border-radius:5px;background:var(--gray-bg);overflow:hidden;margin:12px 0 7px}
.goal .gb i{display:block;height:100%;border-radius:5px;background:var(--grad)}
.sk2{padding:8px 0}
.sk2 .bar i{background:linear-gradient(90deg,var(--blue),#9DB8CC)}
.ty{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.45}
.ty:last-child{border:none}
.star{font-size:34px;letter-spacing:6px;cursor:pointer;user-select:none;text-align:center;padding:6px 0}

/* --- Japandi --- */
.hdr{display:flex;align-items:center;justify-content:space-between;margin:4px 0 6px}
.logo{width:46px;height:46px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px -10px var(--acc)}
.rb{width:46px;height:46px;border-radius:50%;background:var(--solid);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);transition:transform .25s}
.rb:active,.logo:active{transform:scale(.9)}
.hdr .rgt{display:flex;gap:10px}
.hero2{position:relative;min-height:268px;margin:0 -16px;padding:18px 16px 0;overflow:hidden}
.hero2 .hx{position:relative;z-index:2;width:56%}
.hero2 .eb{font-size:12.5px;font-weight:700;color:var(--mut);letter-spacing:.2px;margin-bottom:6px}
.disp{font-size:35px;line-height:1.06;font-weight:800;letter-spacing:-1.4px;margin:0}
.disp span{color:var(--mut)}
.hero2 p{font-size:14px;line-height:1.5;color:var(--mut);margin:12px 0 18px;font-weight:500}
.hero2 .btn{padding:12px 16px 12px 20px;font-size:14px}
.hill{position:absolute;right:-14px;bottom:0;width:54%;max-width:250px;z-index:1;opacity:var(--il)}
.hill svg{display:block;width:100%;height:auto}
.feat{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:6px}
.feat div{background:var(--solid);border-radius:20px;padding:12px 4px 11px;text-align:center;box-shadow:var(--shadow);cursor:pointer;transition:transform .25s cubic-bezier(.2,.9,.3,1.4)}
.feat div:active{transform:scale(.93)}
.feat i{display:flex;width:34px;height:34px;margin:0 auto 6px;border-radius:12px;align-items:center;justify-content:center;font-style:normal;color:var(--acc)}
.feat b{display:block;font-size:20px;font-weight:800;letter-spacing:-.6px;line-height:1.1}
.feat span{display:block;font-size:11px;font-weight:600;color:var(--mut);margin-top:2px;line-height:1.2}
.objs{display:flex;gap:11px;overflow-x:auto;margin:0 -16px;padding:4px 16px 10px;scrollbar-width:none;scroll-snap-type:x mandatory;scroll-padding:0 16px}
.objs::-webkit-scrollbar{display:none}
.oc{position:relative;flex:none;width:128px;height:158px;border-radius:24px;overflow:hidden;cursor:pointer;scroll-snap-align:start;box-shadow:var(--shadow);transition:transform .25s cubic-bezier(.2,.9,.3,1.4)}
.oc:active{transform:scale(.95)}
.oc svg{position:absolute;inset:0;width:100%;height:100%}
.oc .lb{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(251,249,246,.86);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#23241E;border-radius:12px;padding:6px 9px;font-size:12px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc .lb small{display:block;font-weight:600;color:rgba(35,36,30,.55);font-size:10.5px}

    D.team.map(function(m){var i=sel.indexOf(m.row),on=i>=0;return '<div class="chk'+(on?' d':'')+'" data-r="'+m.row+'" style="align-items:center"><span class="box">'+(on?'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>':'')+'</span>'+av(m.name)+'<span style="flex:1;text-decoration:none;color:var(--ink)">'+esc(m.name)+(i===0&&sel.length>1?' ★':'')+'</span><span class="sub">'+m.work+'/'+D.wip+'</span></div>';}).join('')+

function pickPrio(id){choose('Приоритет','',[['🔴 Высокий','Высокий'],['🟡 Средний','Средний'],['⚪ Низкий','Низкий']],function(v){api('prio',{id:id,v:v});});}

function createT(){

function bars(w,color){var max=Math.max.apply(null,w.concat([1])),W=320,H=90,n=w.length,bw=24,g=(W-n*bw)/(n-1);

    s+='<rect x="'+x.toFixed(1)+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="6" fill="'+(last?color:'var(--line)')+'"/>';
    if(v)s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-5)+'" text-anchor="middle" font-size="11" fill="var(--mut)" font-family="Inter,Arial" font-weight="'+(last?700:500)+'">'+v+'</text>';
    s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H+14)+'" text-anchor="middle" font-size="9.5" fill="var(--fnt)" font-family="Inter,Arial">'+D.weekLabels[i]+'</text>';});
  return s+'</svg>';}

  var h='<div class="top" style="background:radial-gradient(420px 260px at 100% -20%,rgba(93,202,165,.7),transparent 60%),linear-gradient(135deg,#085041,#0C447C)"><div class="tag"><i></i>Статистика</div><h1>'+(x?esc(x.name):'Отдел')+'</h1><div class="sub">за '+{w:'неделю',m:'месяц',q:'квартал',a:'всё время'}[statP]+'</div></div>';
  h+=modeSeg()+'<div class="seg" style="margin-top:8px">'+P.map(function(p){return '<button class="'+(statP===p[0]?'on':'')+'" onclick="loadStats(\''+p[0]+'\')">'+p[1]+'</button>';}).join('')+'</div>';
  if(lead)h+='<div class="chips" style="margin-top:10px"><div class="chip'+(!statRow?' on':'')+'" onclick="statRow=0;renderStats()">Отдел</div>'+S.members.map(function(m){return '<div class="chip'+(statRow===m.row?' on':'')+'" onclick="statRow='+m.row+';renderStats()">'+esc(short(m.name))+'</div>';}).join('')+'</div>';
  h+='<div class="card hero" style="margin-top:12px">'+ring(s.onTime)+'<div><div class="t1">'+s.done+' закрыто</div><div class="t2">в срок '+(s.onTimeN!=null?s.onTimeN+' из '+s.withDueN:'—')+'<br>'+(s.avg!==null?'в среднем '+String(s.avg).replace('.',',')+' дн. на задачу':'')+'</div></div></div>';
  var cells=[['Активных',s.active],['Просрочено',s.overdue],['На проверке',s.review],['Часов учтено',s.hours],['Возвратов',s.ret],['Переносов срока',s.ext]];
  if(s.planDev!==null&&s.planDev!==undefined)cells.push(['Отклонение от оценки',(s.planDev>0?'+':'')+String(s.planDev).replace('.',',')+' дн.']);
  if(!x)cells.push(['Свободных',s.free]);
  h+='<div class="big" style="margin-top:8px">'+cells.map(function(c){return '<div class="c"><div class="v">'+c[1]+'</div><div class="k">'+c[0]+'</div></div>';}).join('')+'</div>';
  h+='<div class="sec"><b>Закрыто по неделям</b></div><div class="card">'+bars(s.weeks,'var(--green)')+'</div>';
  if(s.reasons&&s.reasons.length)h+='<div class="sec"><b>Причины возвратов</b></div><div class="card">'+s.reasons.map(function(r){return '<div style="display:flex;justify-content:space-between;padding:5px 0"><span>'+esc(r[0])+'</span><b>'+r[1]+'</b></div>';}).join('')+'</div>';
  if(s.types&&s.types.length)h+='<div class="sec"><b>Типы работ</b></div><div class="card">'+s.types.map(function(r){return '<div style="display:flex;justify-content:space-between;padding:5px 0"><span>'+esc(r[0])+'</span><b>'+r[1]+'</b></div>';}).join('')+'</div>';
  if(lead&&!x)h+='<div class="sec"><b>Команда</b></div>'+S.members.map(function(m){return '<div class="person" onclick="statRow='+m.row+';renderStats()">'+av(m.name,40)+'<div style="flex:1"><div style="font-weight:600">'+esc(m.name)+'</div><div class="sub">закрыто '+m.done+' · в срок '+(m.onTime===null?'—':m.onTime+'%')+' · активных '+m.active+(m.overdue?' · <b style="color:var(--red)">просрочено '+m.overdue+'</b>':'')+'</div></div></div>';}).join('');
  $('v-stats').innerHTML=h;
}
function loadStats(p){statP=p;api('stats',{p:p},null,true);}
function loadRes(p){resP=p;api('stats',{},null,true);}
function hb(list,color,lim){var max=Math.max.apply(null,list.map(function(x){return x.n;}).concat([1]));
  return list.slice(0,lim).map(function(o){return '<div style="padding:6px 0"><div style="display:flex;justify-content:space-between;gap:8px;font-size:13px"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(o.name)+'</span><b>'+o.n+'</b></div><div class="bar"><i style="width:'+Math.max(3,Math.round(o.n/max*100))+'%;background:'+color+'"></i></div></div>';}).join('')||'<div class="sub">Нет данных</div>';}
function mbars(m){var max=Math.max.apply(null,m.map(function(x){return x.n;}).concat([1])),W=340,H=96,n=m.length,bw=20,g=(W-n*bw)/(n-1);
  var s='<svg viewBox="0 0 '+W+' '+(H+18)+'" width="100%" style="display:block">';
  m.forEach(function(x,i){var h=Math.max(3,Math.round(x.n/max*(H-18))),X=i*(bw+g),Y=H-h,last=i===n-1;
    s+='<rect x="'+X.toFixed(1)+'" y="'+Y+'" width="'+bw+'" height="'+h+'" rx="5" fill="'+(last?'var(--green)':'var(--line)')+'"/>';
    if(x.n)s+='<text x="'+(X+bw/2).toFixed(1)+'" y="'+(Y-4)+'" text-anchor="middle" font-size="10" fill="var(--mut)" font-family="Inter,Arial" font-weight="600">'+x.n+'</text>';
    s+='<text x="'+(X+bw/2).toFixed(1)+'" y="'+(H+13)+'" text-anchor="middle" font-size="8.5" fill="var(--fnt)" font-family="Inter,Arial">'+esc(x.label.split(' ')[0])+'</text>';});
  return s+'</svg>';}
function renderResults(){
  var r=D.results,P=[['m','Месяц'],['pm','Прошлый'],['q','Квартал'],['y','Год'],['a','Всё']];
  var h='<div class="top" style="background:radial-gradient(420px 260px at 100% -20%,rgba(93,202,165,.75),transparent 60%),linear-gradient(135deg,#085041,#1F3B8C)"><div class="tag"><i></i>Результаты</div><h1>'+(isLead()?'Результаты команды':'Мои результаты')+'</h1><div class="sub">'+(r?esc(r.label)+' · все выполненные задачи':'Загрузка…')+'</div></div>';
  h+=modeSeg()+'<div class="seg" style="margin-top:8px">'+P.map(function(p){return '<button class="'+(resP===p[0]?'on':'')+'" onclick="loadRes(\''+p[0]+'\')">'+p[1]+'</button>';}).join('')+'</div>';
  if(!r||r.pk!==resP){$('v-stats').innerHTML=h+'<div class="ill"><div class="spin"></div></div>';return;}
  var K=[[r.total,'Выполнено задач'],[r.onTime===null?'—':r.onTime+'%','Сдано в срок'],[r.avgDays===null?'—':String(r.avgDays).replace('.',','),'Среднее время, дн.'],[String(r.hours).replace('.',','),'Учтено часов'],[r.objectsN,'Объектов'],[r.allTime,'Всего за всё время']];
  h+='<div class="big" style="margin-top:10px">'+K.map(function(k,i){return '<div class="c"><div class="v" style="'+(i===0?'color:var(--green)':'')+'">'+k[0]+'</div><div class="k">'+k[1]+'</div></div>';}).join('')+'</div>';
  h+='<div class="sec"><b>По месяцам</b><span style="color:var(--mut)">12 мес.</span></div><div class="card">'+mbars(r.months)+'</div>';
  if(isLead()&&r.people.length)h+='<div class="sec"><b>Команда</b></div>'+r.people.map(function(p){var na=p.name==='Не указан';return '<div class="person">'+(na?'<span class="av" style="width:40px;height:40px;background:var(--gray-bg);color:var(--fnt)">—</span>':av(p.name,40))+'<div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:8px"><b style="font-weight:600">'+esc(na?'Без исполнителя':p.name)+'</b><b>'+p.done+'</b></div><div class="sub">'+(na?'задачи из старого списка':'доля '+p.share+'% · в срок '+(p.onTime===null?'—':p.onTime+'%')+(p.avg!==null?' · ср. '+String(p.avg).replace('.',',')+' дн.':''))+'</div></div></div>';}).join('');
  h+='<div class="sec"><b>Объекты</b></div><div class="card">'+hb(r.objects,'#77628E',8)+'</div>';
  h+='<div class="sec"><b>Виды работ</b></div><div class="card">'+hb(r.types,'#C9962F',8)+'</div>';
  h+='<div class="acts"><button class="btn pri" onclick="api(\'resPdf\',{})">📄 PDF в Telegram</button>'+(isLead()&&D.reportUrl?'<a class="btn sec2" style="text-decoration:none" href="'+esc(D.reportUrl)+'" target="_blank">🌐 Отчёт для руководства</a>':'')+'</div>';
  h+='<div class="sec"><b>Выполненные задачи</b><span style="color:var(--mut)">'+r.total+'</span></div><div class="search">'+ic('search',18)+'<input placeholder="Поиск" value="'+esc(rq)+'" oninput="rq=this.value;renderResList()"></div><div id="rl"></div>';
  $('v-stats').innerHTML=h;renderResList();
}
function renderResList(){var r=D.results,q=rq.toLowerCase(),M=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'],cur=null,h='';
  var L=r.tasks.filter(function(t){return !q||(t.id+' '+t.obj+' '+t.title+' '+t.exec).toLowerCase().indexOf(q)>=0;});
  if(!L.length){$('rl').innerHTML=emptyIll('Выполненных задач нет');return;}
  L.slice(0,300).forEach(function(t){var g=t.done?M[Number(t.done.slice(3,5))-1]+' '+t.done.slice(6):'Без даты';if(g!==cur){cur=g;h+='<div class="grp">'+g+'</div>';}
    h+='<div class="row" style="cursor:default"><span class="dot" style="background:var(--green)"></span><div class="main"><div class="o">#'+esc(t.id)+' · '+esc(t.obj)+'</div><div class="ti">'+esc(t.title)+'</div><div class="meta"><span class="pill" style="background:var(--green-bg);color:var(--green)">'+(t.done?'✓ '+t.done.slice(0,5):'✓ выполнено')+'</span>'+(t.onTime===false?'<span class="pill" style="background:var(--red-bg);color:var(--red)">не в срок</span>':'')+(t.type?'<span class="pill" style="background:var(--soft);color:var(--mut)">'+esc(t.type)+'</span>':'')+(isLead()&&t.exec?'<span style="margin-left:auto">'+avs(t)+'</span>':'')+'</div></div></div>';});
  $('rl').innerHTML=h;}

function renderTeam(){
  var G=D.game||{team:[]},byRow={};G.team.forEach(function(x){byRow[x.row]=x;});
  var h='<h1>Команда</h1><div class="sub">Лимит одновременно в работе: '+D.wip+'</div>';
  h+=goalCard(true);
  var hero=G.team.slice().sort(function(a,b){return b.weekXp-a.weekXp;})[0];
  if(hero&&hero.weekXp)h+='<div class="card" style="margin-top:10px;display:flex;gap:12px;align-items:center"><div style="font-size:30px">🦸</div><div><div class="sub">Герой недели</div><div style="font-weight:700">'+esc(hero.name)+' · +'+hero.weekXp+' опыта</div></div></div>';
  h+='<div class="acts"><button class="btn acc" onclick="pickWotw()">🏆 Работа недели</button><button class="btn sec2" onclick="thanksPick()">💛 Поблагодарить</button></div>';
  h+='<div class="sec"><b>Сотрудники</b></div>';
  h+=D.team.filter(function(m){return !m.lead;}).map(function(m){var g=byRow[m.row]||{};var pct=Math.min(100,Math.round(m.work/D.wip*100));
    return '<div class="person" onclick="openProfile('+m.row+')">'+av(m.name,42)+'<div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:8px"><b style="font-weight:700">'+esc(m.name)+'</b><span class="pill" style="background:var(--violet-bg);color:var(--violet)">ур. '+(g.level||1)+'</span></div>'+
      '<div class="sub">'+esc(g.levelName||m.pos)+' · 🔥 '+(g.streak||0)+' · 🏅 '+(g.badgesN||0)+' · ⭐ '+(g.quality==null?'—':String(g.quality).replace('.',','))+'</div>'+
      '<div class="bar"><i style="width:'+pct+'%;background:'+(m.work>=D.wip?'var(--red)':'var(--blue)')+'"></i></div><div class="sub" style="margin-top:5px">в работе '+m.work+'/'+D.wip+' · всего '+m.active+(m.overdue?' · <b style="color:var(--red)">просрочено '+m.overdue+'</b>':'')+'</div></div></div>';}).join('');
  h+='<div class="sec"><b>Объявление команде</b></div><textarea class="inp" id="ann" placeholder="Например: завтра планёрка в 10:00"></textarea><button class="btn pri wide" style="margin-top:8px" onclick="var v=$(\'ann\').value.trim();if(v)api(\'announce\',{text:v});">Отправить всем в Telegram</button>';
  $('v-team').innerHTML=h;
}
function goalCard(edit){var g=D.game&&D.game.goal;if(!g)return '';
  return '<div class="card goal" style="margin-top:10px"'+(edit?' onclick="editGoal()"':'')+'><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:15px">🎯 Цель команды · '+esc(g.label.split(' ')[0])+'</b><span class="sub">'+(edit?'изменить':g.pct+'%')+'</span></div>'+
    '<div class="gb"><i style="width:'+g.pct+'%"></i></div><div class="sub"><b style="color:var(--ink)">'+g.done+' / '+g.tasks+'</b> задач · в срок '+(g.ot===null?'—':g.ot+'%')+' (цель '+g.ontime+'%)'+(g.reward?' · 🎁 '+esc(g.reward):'')+(g.reached?' · <b style="color:var(--green)">выполнено!</b>':'')+'</div></div>';}
function editGoal(){var g=D.game.goal;ask('Цель на месяц: задач, % в срок, награда','Например: 45 90 командный обед',function(v){var m=v.match(/(\d+)\D+(\d+)\s*%?\s*(.*)/)||v.match(/(\d+)()(.*)/);if(!m){toast('Например: 45 90 обед');return;}api('goal',{tasks:Number(m[1]),ontime:Number(m[2])||85,reward:(m[3]||'').trim()});});}
function pickWotw(){var w=(D.game&&D.game.week)||[];if(!w.length){toast('За неделю нет выполненных задач');return;}choose('Работа недели','Автор получит награду, команда — объявление',w.map(function(t){return [short(t.exec||'—')+' · '+t.obj+' — '+t.title,t.id];}),function(v){api('wotw',{id:v});});}
function thanksPick(){choose('Кого поблагодарить?','',D.team.filter(function(m){return m.name!==D.me.name;}).map(function(m){return [m.name,String(m.row)];}),function(r){thanksText({row:Number(r)});});}
function thanksTask(id){thanksText({id:id});}
function thanksText(p){var Q=(D.game&&D.game.quick)||['Спасибо!'];choose('Благодарность','',Q.map(function(q){return [q,q];}).concat([['✏️ Написать своё','__own']]),function(v){
  if(v==='__own'){ask('Ваша благодарность','За что спасибо?',function(t){p.text=t;api('thanks',p);});return;}p.text=v;api('thanks',p);});}
function acceptT(id){openSheet('<div style="font-size:18px;font-weight:700;margin:4px 2px 4px">Принять задачу</div><div class="sub" style="margin:0 2px 12px">Оцените качество — это влияет на опыт и награды сотрудника</div><div class="card"><div class="star" id="stars">'+[1,2,3,4,5].map(function(n){return '<span data-n="'+n+'" style="color:var(--line)">★</span>';}).join('')+'</div></div><div class="acts"><button class="btn sec2" id="st0">Без оценки</button><button class="btn grn" id="st1">Принять</button></div>','stars');
  var cur=0;function paint(){Array.prototype.forEach.call($('stars').children,function(e){e.style.color=Number(e.getAttribute('data-n'))<=cur?'#C9962F':'var(--line)';});}
  Array.prototype.forEach.call($('stars').children,function(e){e.onclick=function(){cur=Number(e.getAttribute('data-n'));paint();haptic('sel');};});
  $('st0').onclick=function(){back();api('accept',{id:id,stars:0});};$('st1').onclick=function(){if(!cur){toast('Выберите звёзды или «Без оценки»');return;}back();api('accept',{id:id,stars:cur});};}
function xpPct(g){return g.next?Math.round((g.xp-g.cur)/(g.next-g.cur)*100):100;}
function openProfile(row){profRow=row;view='profile';window.scrollTo(0,0);render();}
function renderProfile(){
  var row=isLead()?profRow:D.me.row,g=D.game&&D.game.profiles[row];
  if(!g){$('v-profile').innerHTML=emptyIll('Профиль появится после первой выполненной задачи');return;}
  var got=g.badges.filter(function(b){return b.got;}).length;
  var h=(isLead()?'<button class="btn sm sec2" style="margin-bottom:10px" onclick="go(\'team\')">← Команда</button>':'');
  h+='<div class="top pf"><div class="tag"><i></i>Профиль</div><h1>'+esc(g.name)+'</h1><div class="sub">'+esc(g.pos||'')+'</div>'+
    '<div style="margin-top:12px"><span class="lvl">🏅 Уровень '+g.level+' · '+esc(g.levelName)+'</span></div>'+
    '<div class="sub" style="margin-top:10px">'+g.xp+(g.next?' / '+g.next+' опыта до уровня '+(g.level+1):' опыта · максимальный уровень')+'</div><div class="xp"><i style="width:'+xpPct(g)+'%"></i></div>'+
    '<div class="qs"><div><b>🔥 '+g.streak+'</b><span>дней без просрочек</span></div><div><b>⭐ '+(g.quality==null?'—':String(g.quality).replace('.',','))+'</b><span>качество</span></div><div><b>💛 '+g.thanksN+'</b><span>благодарностей</span></div></div></div>';
  h+=goalCard(false);
  h+='<div class="sec"><b>Награды</b><span style="color:var(--mut)">'+got+' из '+g.badges.length+'</span></div><div class="bdg">'+g.badges.slice().sort(function(a,b){return b.got-a.got;}).map(function(b){return '<div class="bd '+(b.got?'on':'off')+'" onclick="toast(\''+esc(b.n).replace(/'/g,'')+': '+esc(b.d).replace(/'/g,'')+(b.got?' ✓':' · '+b.prog)+'\')"><i>'+b.e+'</i>'+esc(b.n)+'</div>';}).join('')+'</div>';
  if(g.skills.length)h+='<div class="sec"><b>Навыки</b></div><div class="card">'+g.skills.slice(0,6).map(function(s){return '<div class="sk2"><div style="display:flex;justify-content:space-between;font-size:13.5px"><span>'+esc(s.type)+'</span><b>ур. '+s.level+'</b></div><div class="bar"><i style="width:'+s.pct+'%"></i></div><div class="sub" style="font-size:11.5px;margin-top:3px">'+s.n+' задач · '+s.xp+' опыта</div></div>';}).join('')+'</div>';
  h+='<div class="sec"><b>Благодарности</b>'+(g.name!==D.me.name?'<span onclick="thanksText({row:'+g.row+'})">💛 Поблагодарить</span>':'<span onclick="thanksPick()">💛 Коллеге</span>')+'</div><div class="card" style="padding:4px 14px">'+(g.thanks.length?g.thanks.map(function(x){return '<div class="ty"><div style="font-size:20px">💛</div><div><b>'+esc(short(x.from))+'</b> <span class="sub">'+esc(x.when)+'</span><div>'+esc(x.text)+'</div></div></div>';}).join(''):'<div class="ty" style="color:var(--fnt)">Пока нет — всё впереди</div>')+'</div>';
  h+='<div class="sec"><b>Портфолио</b><span style="color:var(--mut)">'+g.doneN+'</span></div>'+(g.portfolio.length?g.portfolio.slice(0,30).map(function(t){return '<div class="row" style="--st:var(--green);cursor:default"><div class="main"><div class="o">#'+esc(t.id)+' · '+esc(t.obj)+'</div><div class="ti">'+esc(t.title)+'</div><div class="meta"><span class="pill" style="background:var(--green-bg);color:var(--green)">✓ '+esc(t.done||'выполнено')+'</span>'+(t.stars?'<span class="pill" style="background:var(--amber-bg);color:var(--amber)">'+'★'.repeat(t.stars)+'</span>':'')+(t.link?'<a class="pill" style="background:var(--acc-bg);color:var(--acc);text-decoration:none" href="'+esc(t.link)+'" target="_blank">🔗 файл</a>':'')+'</div></div></div>';}).join(''):emptyIll('Здесь появятся выполненные задачи'));
  if(isLead())h+='<button class="btn sec2 wide" style="margin-top:12px" onclick="tf=\'p'+g.row+'\';go(\'tasks\')">Задачи сотрудника</button>';
  $('v-profile').innerHTML=h;
}
</script>

var DEMO=null;function DEMO_ACT(){return {};}
