<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Задачи</title>
<!-- Постоянный загрузчик. Этот файл больше менять не нужно: само приложение приходит из Google Apps Script. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
html,body{margin:0;height:100%;background:#ECE7DF;color:#23241E;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}
@media (prefers-color-scheme:dark){html,body{background:#161512;color:#EEE8DD}}
.ld{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:0 32px}
.lg{width:64px;height:64px;border-radius:50%;background:#424C36;color:#F7F4EF;display:flex;align-items:center;justify-content:center;animation:p 1.4s ease-in-out infinite}
@keyframes p{50%{transform:scale(.92);opacity:.8}}
.ms{font-size:15px;line-height:1.5;opacity:.7;max-width:300px}
.bt{border:0;border-radius:999px;padding:12px 22px;background:#424C36;color:#F7F4EF;font:inherit;font-weight:600;font-size:15px}
</style></head>
<body><div class="ld" id="ld"><div class="lg"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 20V11a6 6 0 0 1 12 0v9"/><path d="M4 20h16"/></svg></div><div class="ms" id="ms">Загружаем задачи…</div></div>
<script>
(function(){
  var QS=new URLSearchParams(location.search),API=QS.get('api')||'';
  try{var T=window.Telegram&&Telegram.WebApp;if(T){T.ready();T.expand();var dk=T.colorScheme==='dark';T.setHeaderColor(dk?'#161512':'#ECE7DF');T.setBackgroundColor(dk?'#161512':'#ECE7DF');if(dk){document.documentElement.style.background='#161512';document.body.style.background='#161512';document.body.style.color='#EEE8DD';}}}catch(e){}
  function say(t,btn){document.getElementById('ms').innerHTML=t+(btn?'<div style="margin-top:16px"><button class="bt" onclick="location.reload()">Повторить</button></div>':'');}
  function mount(html){
    var doc=new DOMParser().parseFromString(html,'text/html');
    if(doc.title)document.title=doc.title;
    var sc=[].slice.call(doc.querySelectorAll('script'));
    sc.forEach(function(s){s.parentNode.removeChild(s);});
    [].forEach.call(doc.head.querySelectorAll('style,link'),function(n){document.head.appendChild(document.importNode(n,true));});
    document.body.innerHTML=doc.body.innerHTML;
    (function next(i){
      if(i>=sc.length)return;var s=sc[i],e=document.createElement('script');
      if(s.src){if(/telegram-web-app/.test(s.src)&&window.Telegram&&Telegram.WebApp)return next(i+1);
        e.src=s.src;e.onload=e.onerror=function(){next(i+1);};document.head.appendChild(e);}
      else{e.text=s.textContent;document.body.appendChild(e);next(i+1);}
    })(0);
  }
  function load(n){
    fetch(API,{method:'POST',body:JSON.stringify({app:1,a:'code'})}).then(function(r){return r.json();}).then(function(r){
      if(!r||!r.html)throw new Error('empty');
      try{localStorage.setItem('tk_code',r.html);localStorage.setItem('tk_v',r.v);}catch(e){}
      mount(r.html);
    }).catch(function(){if((n||0)<2)return setTimeout(function(){load((n||0)+1);},900);say('Не удалось загрузить приложение. Проверьте интернет.',true);});
  }
  window.addEventListener('DOMContentLoaded',function(){
    if(!API){say('Откройте приложение из Telegram-бота — кнопка «Приложение».');return;}
    var c=null;try{c=localStorage.getItem('tk_code');}catch(e){}
    if(c){try{mount(c);
      setTimeout(function(){if(typeof window.D==='undefined'||window.D===null){try{if(sessionStorage.getItem('tk_rs'))return;sessionStorage.setItem('tk_rs','1');localStorage.removeItem('tk_code');}catch(x){}location.reload();}},15000);
      return;}catch(e){try{localStorage.removeItem('tk_code');}catch(x){}}}
    load(0);
  });
})();
</script>
</body></html>
